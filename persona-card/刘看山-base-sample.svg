<svg viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg" width="240" height="320">
  <defs>
    <!-- 身体：白色软胶质感 -->
    <radialGradient id="bodyGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f6f8"/>
      <stop offset="100%" stop-color="#e0e3e8"/>
    </radialGradient>
    <!-- 四肢：黑色圆柱质感 -->
    <linearGradient id="limbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="40%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <!-- 鼻子：高光大黑球 -->
    <radialGradient id="noseGrad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="60%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- 阴影 -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 地面阴影 -->
  <ellipse cx="120" cy="300" rx="65" ry="10" fill="#000000" opacity="0.12"/>

  <!-- 尾巴（背面小圆球） -->
  <circle cx="165" cy="205" r="22" fill="url(#bodyGrad)" stroke="#d1d5db" stroke-width="1"/>

  <!-- 左腿 -->
  <path d="M95 230 L95 285 A12 12 0 0 0 119 285 L119 230" fill="url(#limbGrad)"/>
  <!-- 右腿 -->
  <path d="M145 230 L145 285 A12 12 0 0 0 169 285 L169 230" fill="url(#limbGrad)"/>

  <!-- 身体主体 -->
  <path d="M75 95 
           C65 90 50 105 48 140 
           C45 185 55 240 90 255 
           C105 262 155 262 170 250 
           C195 232 200 185 195 145 
           C194 110 180 95 165 95 
           C140 95 100 95 75 95 Z" 
        fill="url(#bodyGrad)" filter="url(#softShadow)"/>

  <!-- 左耳 -->
  <path d="M78 105 C70 70 80 45 95 55 C108 62 112 85 110 102" fill="url(#bodyGrad)" stroke="#d1d5db" stroke-width="1"/>
  <!-- 右耳 -->
  <path d="M135 102 C133 85 137 62 150 55 C165 45 175 70 168 105" fill="url(#bodyGrad)" stroke="#d1d5db" stroke-width="1"/>

  <!-- 左臂 -->
  <path d="M52 150 C40 165 38 190 48 205 C52 212 60 210 62 200 C65 185 63 165 72 155" fill="url(#limbGrad)"/>
  <!-- 右臂 -->
  <path d="M188 150 C200 165 202 190 192 205 C188 212 180 210 178 200 C175 185 177 165 168 155" fill="url(#limbGrad)"/>

  <!-- 小手（左） -->
  <g transform="translate(43,205)">
    <ellipse cx="0" cy="0" rx="7" ry="5" fill="#000"/>
    <path d="M-5 2 Q-8 8 -2 8" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M0 2 Q0 10 5 9" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <!-- 小手（右） -->
  <g transform="translate(197,205)">
    <ellipse cx="0" cy="0" rx="7" ry="5" fill="#000"/>
    <path d="M5 2 Q8 8 2 8" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M0 2 Q0 10 -5 9" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 眼睛（左） -->
  <circle cx="90" cy="120" r="5" fill="#000000"/>
  <!-- 眼睛（右） -->
  <circle cx="125" cy="120" r="5" fill="#000000"/>

  <!-- 大鼻子 -->
  <ellipse cx="152" cy="135" rx="28" ry="24" fill="url(#noseGrad)" filter="url(#softShadow)"/>
  <!-- 鼻子高光 -->
  <ellipse cx="142" cy="125" rx="8" ry="5" fill="#ffffff" opacity="0.2"/>
</svg>